info:
  name: Auto Complete
  type: http
  seq: 2

http:
  method: POST
  url: "{{url}}/autocomplete"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: "{\r\n    \"term\": \"Avengers\"\r\n}"

runtime:
  scripts:
    - type: after-response
      code: "test(\"Status code is 201\", function () {\r

        \    expect(res.getStatus()).to.equal(200);\r

        });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Auto Complete
    request:
      url: "{{url}}/autocomplete"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: multipart-form
        data:
          - name: term
            type: text
            value: Avengers
            description: The search term.
    response:
      statusText: "200"
      headers:
        - name: Server
          value: nginx
        - name: Date
          value: Thu, 14 Apr 2022 12:32:18 GMT
        - name: Content-Type
          value: application/json
        - name: Transfer-Encoding
          value: chunked
        - name: Connection
          value: keep-alive
        - name: Vary
          value: Accept-Encoding
        - name: Vary
          value: Authorization
        - name: Cache-Control
          value: private, must-revalidate
        - name: pragma
          value: no-cache
        - name: expires
          value: "-1"
        - name: Access-Control-Allow-Origin
          value: "*"
        - name: Access-Control-Allow-Methods
          value: POST, GET, OPTIONS, PUT, DELETE
        - name: Access-Control-Allow-Credentials
          value: "true"
        - name: Access-Control-Max-Age
          value: "86400"
        - name: Access-Control-Allow-Headers
          value: Content-Type, Authorization, X-Requested-With
        - name: Content-Encoding
