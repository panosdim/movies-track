info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/register"
  body:
    type: json
    data: |
      {
        "email": "test@test.com",
        "password": "testpass",
        "firstName": "first name",
        "lastName": "last name"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        test("Status code is 204", function () {
          expect(res.getStatus()).to.equal(204);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
