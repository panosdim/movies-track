info:
  name: Login
  type: http
  seq: 5

http:
  method: POST
  url: "{{url}}/login"
  body:
    type: json
    data: |
      {
        "email": "test@test.com",
        "password": "testpass"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        var token = res.getBody().token;
        bru.setGlobalEnvVar("token", token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
