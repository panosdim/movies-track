info:
  name: Register Wrong Email
  type: http
  seq: 4

http:
  method: POST
  url: "{{url}}/register"
  body:
    type: json
    data: "{\r

      \    \"email\": \"test.com\",\r

      \    \"password\": \"testpass\",\r

      \    \"lastName\": \"last name\",\r

      \    \"firstName\": \"first name\"\r

      }\r\n"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 422", function () {
            expect(res.getStatus()).to.equal(422);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
