opencollection: 1.0.0

info:
  name: Movies Track
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{token}}"
  variables:
    - name: url
      value: http://localhost:8000/api/v1
    - name: token
      value: ""
    - name: movie_id
      value: ""
    - name: delete_movie_id
      value: ""
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
