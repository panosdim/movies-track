<p-card [style]="{ width: '185px', overflow: 'hidden' }">
  <ng-template #header>
    <a
      href="https://www.themoviedb.org/movie/{{ movie().movieId }}"
      target="_blank"
      rel="noopener noreferrer"
    >
      <img alt="Card" style="width: 100%" src="{{ imageBaseUrl }}w185{{ movie().poster }}" />
    </a>
  </ng-template>
  <ng-template #title>
    @if (movie().voteAverage !== null && movie().voteAverage !== 0) {
    <p-progressbar [value]="Math.round(movie().voteAverage * 10)" />
    }
  </ng-template>
  <div class="watch-info">
    @for (provider of movie().providers; track provider) {
    <img [src]="imageBaseUrl + 'w45/' + provider.logoPath" alt="Provider Logo" />
    }
  </div>
  <ng-template #footer>
    @if (searchMode()) {
    <p-button label="Add to Watchlist" class="w-full search-action-button" />
    } @else {
    <div
      style="display: flex; align-items: center; justify-content: space-between; margin-top: 0.5rem"
    >
      <p-button
        icon="pi pi-trash"
        severity="danger"
        [rounded]="true"
        [outlined]="true"
        pTooltip="Delete movie"
        tooltipPosition="bottom"
      />
      <p-button
        icon="pi pi-check"
        severity="success"
        [rounded]="true"
        [outlined]="true"
        pTooltip="Mark as watched"
        tooltipPosition="bottom"
      />
    </div>
    }
  </ng-template>
</p-card>
