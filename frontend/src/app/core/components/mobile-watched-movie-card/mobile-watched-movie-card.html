<p-card [style]="{ width: '100%', overflow: 'hidden' }">
  <div class="card-body">
    <a
      href="https://www.themoviedb.org/movie/{{ movie().movieId }}"
      target="_blank"
      rel="noopener noreferrer"
    >
      <img alt="Card" src="{{ imageBaseUrl }}w92{{ movie().poster }}" />
    </a>
    <div class="card-info">
      <h3 class="movie-title">{{ movie().title }}</h3>
      <div style="display: flex; align-items: center; justify-content: center">
        <p-rating [ngModel]="movie().rating" (ngModelChange)="rateMovie.emit($event)" />
      </div>
      <div class="button-container">
        <p-button
          icon="pi pi-trash"
          severity="danger"
          [rounded]="true"
          [outlined]="true"
          (onClick)="deleteMovie.emit(movie())"
        />
        <p-button icon="pi pi-check" severity="success" [rounded]="true" [outlined]="true" />
      </div>
    </div>
  </div>
</p-card>
