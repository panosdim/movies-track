<p-confirmDialog />

<div class="movies-container">
  <h1>Watched Movies</h1>

  @if (loading()) {
    <div class="loading-container">
      <i class="pi pi-spin pi-spinner" style="font-size: 3rem; color: var(--p-primary-color)"></i>
    </div>
  }

  @if (!loading() && movies().length === 0) {
    <p class="empty-state">No watched movies yet.</p>
  }

  @if (isMobile()) {
    <div class="movies-list">
      @for (movie of movies(); track movie.id) {
        <app-mobile-watched-movie-card
          [movie]="movie"
          (rateMovie)="rateMovie(movie, $event)"
          (deleteMovie)="confirmDeleteMovie($event)"
        />
      }
    </div>
  } @else {
    <div class="movies-grid">
      @for (movie of movies(); track movie.id) {
        <app-watched-movie-card
          [movie]="movie"
          (rateMovie)="rateMovie(movie, $event)"
          (deleteMovie)="confirmDeleteMovie($event)"
        />
      }
    </div>
  }
</div>
