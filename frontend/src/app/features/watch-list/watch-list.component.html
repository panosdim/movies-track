<p-confirmDialog />

<div class="movies-container">
  <h1>Watch List ({{ movies().length }})</h1>

  @if (loading()) {
    <div class="loading-container">
      <i class="pi pi-spin pi-spinner" style="font-size: 3rem; color: var(--p-primary-color)"></i>
    </div>
  }

  @if (!loading() && movies().length === 0) {
    <p class="empty-state">No movies found. Add some movies to get started!</p>
  }

  @if (isMobile()) {
    <div class="movies-list">
      @for (movie of movies(); track movie.id) {
        <app-mobile-watch-list-movie-card
          [movie]="movie"
          (deleteMovie)="confirmDeleteMovie($event)"
          (watchMovie)="markAsWatched($event)"
        />
      }
    </div>
  } @else {
    <div class="movies-grid">
      @for (movie of movies(); track movie.id) {
        <app-watch-list-movie-card
          [movie]="movie"
          (deleteMovie)="confirmDeleteMovie($event)"
          (watchMovie)="markAsWatched($event)"
        />
      }
    </div>
  }
</div>
